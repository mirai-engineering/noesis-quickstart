<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="980" height="300" fill="#ffffff"/>
  <rect x="30" y="20" width="920" height="260" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="50" y="48" font-size="18" font-weight="bold" fill="#e8590c">File 1 of 2, data/demo.csv: examples of good answers, one column per call</text>
  <text x="50" y="74" font-size="13" fill="#495057">Each row: an input, and the answer you expect from each call. You could write it like this:</text>

  <g font-size="12">
    <rect x="50" y="90" width="880" height="26" fill="#ffe8cc" stroke="#f08c00"/>
    <rect x="50" y="116" width="880" height="26" fill="#ffffff" stroke="#f08c00"/>
    <rect x="50" y="142" width="880" height="26" fill="#ffffff" stroke="#f08c00"/>
    <line x1="315" y1="90" x2="315" y2="168" stroke="#f08c00"/>
    <line x1="420" y1="90" x2="420" y2="168" stroke="#f08c00"/>
    <line x1="500" y1="90" x2="500" y2="168" stroke="#f08c00"/>
    <text x="60" y="108" font-weight="bold">input</text>
    <text x="325" y="108" font-weight="bold">demo/classify</text>
    <text x="430" y="108" font-weight="bold">demo/stars</text>
    <text x="510" y="108" font-weight="bold">demo/reply</text>
    <text x="60" y="134">The pasta was cold and the waiter ignored us.</text>
    <text x="325" y="134">negative</text>
    <text x="430" y="134">1</text>
    <text x="510" y="134">Sorry about the cold pasta and the wait. Your next dessert is on us.</text>
    <text x="60" y="160">Food was fine, but we waited 40 minutes.</text>
    <text x="325" y="160">negative</text>
    <text x="430" y="160">2</text>
    <text x="510" y="160">Glad you liked the food, and sorry for the 40-minute wait.</text>
  </g>

  <g font-size="13" fill="#495057">
    <text x="60" y="200"><tspan font-weight="bold" fill="#1e1e1e">demo/classify</tspan>: a category. Write the one you expect.</text>
    <text x="60" y="224"><tspan font-weight="bold" fill="#1e1e1e">demo/stars</tspan>: a number. Write the one you expect, and tell us how far off is still fine.</text>
    <text x="60" y="248"><tspan font-weight="bold" fill="#1e1e1e">demo/reply</tspan>: a phrase. Many could be good; write one you would be happy to send.</text>
  </g>
</svg>
