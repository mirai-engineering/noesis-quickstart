<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <rect x="30" y="20" width="840" height="290" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="50" y="48" font-size="18" font-weight="bold" fill="#2f9e44">File 2 of 2, data/steps.csv: how your steps connect</text>
  <text x="50" y="72" font-size="13" fill="#495057">You tell us which call runs when and what it receives. We rebuild it so every candidate model runs your app the same way.</text>

  <!-- input -->
  <rect x="50" y="150" width="160" height="50" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="65" y="172" font-weight="bold">input</text>
  <text x="65" y="190" font-size="12" fill="#495057">the review</text>

  <!-- steps -->
  <rect x="330" y="95" width="220" height="50" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="345" y="117" font-weight="bold">1 · demo/classify</text>
  <text x="345" y="135" font-size="12" fill="#495057">receives: input</text>
  <rect x="330" y="205" width="220" height="50" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="345" y="227" font-weight="bold">2 · demo/stars</text>
  <text x="345" y="245" font-size="12" fill="#495057">receives: input</text>
  <rect x="650" y="150" width="200" height="50" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="665" y="172" font-weight="bold">3 · demo/reply</text>
  <text x="665" y="190" font-size="12" fill="#495057">receives: input, demo/classify</text>

  <!-- arrows -->
  <path d="M210,165 L327,122" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M210,185 L327,228" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M550,120 L647,163" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="585" y="128" font-size="12" fill="#1971c2">the label</text>
  <path d="M130,200 C130,295 750,295 750,203" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="400" y="288" font-size="12" fill="#495057">the review, too</text>
</svg>
