[project]
name = "noesis-quickstart"
version = "0.1.0"
description = "Smallest example of integrating an app with a Noesis endpoint: aliases, a CSV eval set, a scored replay."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
