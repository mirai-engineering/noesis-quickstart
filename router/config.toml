# One URL in front of several model servers.
#
# [models.*]   a real server speaking the OpenAI API. Moving from GCP to Modal (or adding a
#              provider) means changing a base_url here; nothing else, and no client changes.
# [aliases]    the names your app uses, one per call site. Re-point an alias to ship a
#              better model without touching the app.
#
# This file runs the demo against tools/fake_backend.py. Replace base_url with real servers.
# TODO: real backends. The GCP vLLM servers need a public path from where the router runs; add one
#       [models.<name>] per server, then point the aliases at them.

[models.fake-small]
base_url = "http://localhost:9000/v1"
# api_key_env = "FAKE_BACKEND_KEY"   # name of the env var holding that server's key, if it needs one
# served_name = "fake-small"         # model name the server expects, if different from the key above

[aliases]
"demo/score" = "fake-small"
"demo/write" = "fake-small"
